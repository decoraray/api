; Overrides the image's www pool. Sized for the 768m container limit:
; a Laravel worker is typically 40-60 MB, so 12 workers leaves headroom.
[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle workers now and then to cap any slow memory growth.
pm.max_requests = 1000
; Send worker stdout/stderr (e.g. stray error_log) to the container log.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
