version: '3.8'
services:
    main:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: shop-app
        restart: unless-stopped
        image: shop
        command: 'php artisan serve --host=0.0.0.0'
        volumes:
            - .:/app
        # depends_on: 
        #     - db
        networks:
            - shop-network

