version: '3.8'
services:
    main:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: shop-app
        restart: unless-stopped
        image: shop
        command: 'php artisan serve --host=0.0.0.0'
        volumes:
            - .:/app
        networks:
            - shop-network

    nginx:
        image: nginx:alpine
        container_name: shop-nginx
        restart: unless-stopped
        ports:
            - 8000:80
        volumes:
            - ./:/var/www
            - ./docker-compose/nginx:/etc/nginx/conf.d/
        networks:
            - shop-network

networks:
    shop-network:
        driver: bridge
