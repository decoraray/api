# Build the api image on GitHub (x86, full internet) and deploy it to the Arvan server.
# The server side is /usr/local/bin/decoraray-deploy (shop-docker repo: scripts/server/deploy.sh):
# it loads the image, restarts the service, health-checks it and rolls back on failure.
# Manual redeploy: Actions -> Deploy -> Run workflow (deploys the branch you pick; normally main).
name: Deploy

on:
  # Only after the Tests workflow passed for a push to main.
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: |
            decoraray-api:latest
            decoraray-api:${{ env.SHA }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Deploy to Arvan
        env:
          SSH_KEY: ${{ secrets.ARVAN_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ARVAN_KNOWN_HOSTS }}
          HOST: ${{ secrets.ARVAN_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "Image size: $(docker image inspect -f '{{.Size}}' decoraray-api:latest | numfmt --to=iec)"
          # No `set -e`: a failure of the registry path must reach the fallback below.
          set -uo pipefail
          REG="localhost:5000/decoraray-api:$SHA"
          TUNNEL_PATTERN='-L 5000:127.0.0.1:5000'
          trap 'pkill -f -- "$TUNNEL_PATTERN" 2>/dev/null || true' EXIT

          registry_push() {
            # Tunnel to the server's loopback registry (key allows only 127.0.0.1:5000).
            ssh -f -N -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 \
                -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                -o ConnectTimeout=30 -L 5000:127.0.0.1:5000 "root@$HOST" || return 1
            local up=0
            for _ in $(seq 1 20); do
              if curl -sf http://localhost:5000/v2/ >/dev/null; then up=1; break; fi
              sleep 1
            done
            [ "$up" = 1 ] || { echo "registry did not answer through the tunnel"; return 1; }
            docker tag decoraray-api:latest "$REG" || return 1
            local start=$SECONDS out
            out=$(mktemp)
            timeout 900 docker push "$REG" 2>&1 | tee "$out"
            local rc=${PIPESTATUS[0]}
            echo "Push summary: $(grep -c 'Pushed' "$out" || true) pushed, $(grep -c 'Layer already exists' "$out" || true) already existed, $((SECONDS - start))s elapsed"
            rm -f "$out"
            return "$rc"
          }

          if registry_push; then
            # The key is restricted server-side to decoraray-deploy; "api <sha> pull" are its arguments.
            # A failure here (health check / rollback on the server) fails the job; no fallback.
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                -o ConnectTimeout=30 -o ServerAliveInterval=30 \
                "root@$HOST" api "$SHA" pull </dev/null
            exit $?
          fi

          echo "::warning::registry path failed, falling back to full stream"
          pkill -f -- "$TUNNEL_PATTERN" 2>/dev/null || true
          # The key is restricted server-side to decoraray-deploy; "api <sha>" are its arguments.
          docker save decoraray-api:latest "decoraray-api:$SHA" | gzip -1 \
            | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                  -o ConnectTimeout=30 -o ServerAliveInterval=30 \
                  "root@$HOST" api "$SHA"
          exit $?

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
