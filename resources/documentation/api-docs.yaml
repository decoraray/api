openapi: 3.0.0
info:
  title: Decoraray API
  description: decoraray
  version: 1.0.0

# the domain of the service
host: decoraray.com

servers:
  - url: http://localhost:8080/api/v1/admin/
    description: Local api , for test
  - url: https://api.decoraray.com/api/v1/admin/
    description: Production api

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid

paths:
  /login:
    post:
      tags:
        - Authentication
      summary: Login to panel by email and pass
      description: this method does not require sms
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: User's email
                password:
                  type: string
                  description: User's password
      responses:
        "200":
          description: Successful authentication
        "401":
          description: Unauthorized
        "404":
          description: User not found

  /deals:
    get:
      tags:
        - Deal
      summary: Returns a list of deals.
      description: deals are predefined and can be used for many products.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: A JSON array of Deals
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /deals/{dealId}/add:
    post:
      tags:
        - Deals
      summary: Gets list of products, and adds them the selected deal
      description: the list of products should be an array
      security:
        - BearerAuth: []
      parameters:
        - name: dealId
          in: path
          required: true
          description: deals are pre defined
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                products:
                  type: array
                  items:
                    type: integer
              required:
                - products
            example:
              products: [84, 82]
      responses:
        "200":
          description: list updated with deal
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /products:
    get:
      tags:
        - Product
      summary: Returns a list of products.
      description: ...
      security:
        - BearerAuth: []
      responses:
        "200":
          description: A JSON array of Products
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer

  /categories:
    get:
      tags:
        - Category
      summary: Returns a list of categories.
      description: ...
      security:
        - BearerAuth: []
      responses:
        "200":
          description: A JSON array of Categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer

  /orders:
    get:
      tags:
        - Orders
      summary: Returns a list of orders.
      description: ...
      security:
        - BearerAuth: []
      responses:
        "200":
          description: A JSON array of orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer

  /colors:
    get:
      tags:
        - Colors
      summary: Returns a list of colors.
      description: ...
      security:
        - BearerAuth: []
      responses:
        "200":
          description: A JSON array of colors.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer

  /payments/{paymentId}:
    patch:
      tags:
        - Payments
      summary: Correct a staff-recorded payment (permission payments.record).
      description: >
        Changes method, paid date and reference, and adds or removes receipts. The amount cannot be
        changed (422): void the payment and record it again. Gateway and voided payments are refused (422).
        Card-to-card and cheque payments must keep at least one receipt.
      security:
        - BearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum: [CARD, CASH, CASH_RECEIVED, CHEQUE, OTHER]
                paid_at:
                  type: string
                  format: date
                reference:
                  type: string
                  nullable: true
                add_receipt_ids:
                  type: array
                  items:
                    type: integer
                remove_receipt_ids:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: The payment's order (same shape as GET /orders/uuid/{uuid}).
        "403":
          description: Missing payments.record.
        "422":
          description: Amount sent, gateway or voided payment, or receipt rules not met.

  /payments/{paymentId}/void:
    post:
      tags:
        - Payments
      summary: Void a staff-recorded payment (permission payments.void, SuperAdmin).
      description: >
        The payment is kept with status "void", the reason, who voided it and when, and is no longer
        counted in paid totals, balances or reports. The linked quote's status is recalculated.
      security:
        - BearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: The payment's order (same shape as GET /orders/uuid/{uuid}).
        "403":
          description: Missing payments.void.
        "422":
          description: Reason missing, gateway payment, or already voided.
