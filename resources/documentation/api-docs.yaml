openapi: 3.0.0
info:
  title: Decoraray API
  description: decoraray
  version: 1.0.0

# the domain of the service
host: decoraray.ir

servers:
  - url: http://localhost:8080/api/v1/
    description: Local api , for test
  - url: https://api.decoraray.ir/api/v1/
    description: Production api

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid

paths:
  /admin/login:
    post:
      tags:
        - Authentication
      summary: Login to panel by email and pass
      description: this method does not require sms
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: User's email
                password:
                  type: string
                  description: User's password
      responses:
        "200":
          description: Successful authentication
        "401":
          description: Unauthorized
        "404":
          description: User not found

  /admin/deals:
    get:
      tags:
        - Deals
      summary: Returns a list of deals.
      description: deals are predefined and can be used for many products.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: A JSON array of user deals
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /admin/deals/{dealId}/add:
    post:
      tags:
        - Deals
      summary: Gets list of products, and adds them the selected deal
      description: the list of products should be an array
      security:
        - BearerAuth: []
      parameters:
        - name: dealId
          in: path
          required: true
          description: deals are pre defined
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                products:
                  type: array
                  items:
                    type: integer
              required:
                - products
            example:
              products: [84, 82]
      responses:
        "200":
          description: list updated with deal
