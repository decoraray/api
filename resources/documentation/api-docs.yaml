openapi: 3.0.0
info:
  title: Decoraray API
  description: decoraray
  version: 1.0.0

# the domain of the service
host: decoraray.com

servers:
  - url: http://localhost:8080/api/v1/admin/
    description: Local api , for test
  - url: https://api.decoraray.com/api/v1/admin/
    description: Production api

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid

paths:
  /login:
    post:
      tags:
        - Authentication
      summary: Login to panel by email and pass
      description: this method does not require sms
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: User's email
                password:
                  type: string
                  description: User's password
      responses:
        "200":
          description: Successful authentication
        "401":
          description: Unauthorized
        "404":
          description: User not found

  /deals:
    get:
      tags:
        - Deal
      summary: Returns a list of deals.
      description: deals are predefined and can be used for many products.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: A JSON array of Deals
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /deals/{dealId}/add:
    post:
      tags:
        - Deals
      summary: Gets list of products, and adds them the selected deal
      description: the list of products should be an array
      security:
        - BearerAuth: []
      parameters:
        - name: dealId
          in: path
          required: true
          description: deals are pre defined
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                products:
                  type: array
                  items:
                    type: integer
              required:
                - products
            example:
              products: [84, 82]
      responses:
        "200":
          description: list updated with deal
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /products:
    get:
      tags:
        - Product
      summary: Returns a list of products.
      description: ...
      security:
        - BearerAuth: []
      responses:
        "200":
          description: A JSON array of Products
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer

  /categories:
    get:
      tags:
        - Category
      summary: Returns a list of categories.
      description: ...
      security:
        - BearerAuth: []
      responses:
        "200":
          description: A JSON array of Categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer

  /orders:
    get:
      tags:
        - Orders
      summary: Returns a list of orders.
      description: ...
      security:
        - BearerAuth: []
      responses:
        "200":
          description: A JSON array of orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer

  /colors:
    get:
      tags:
        - Colors
      summary: Returns a list of colors.
      description: ...
      security:
        - BearerAuth: []
      responses:
        "200":
          description: A JSON array of colors.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer

  /leads/{leadId}/activities/{activityId}:
    patch:
      tags:
        - Leads
      summary: Edit the text of a note, call or message (permission leads.manage; author or SuperAdmin).
      description: System and channel activities (stage changes, quotes, website enquiries, Instagram) are read-only (422). Sets edited_at.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 5000
      responses:
        "200":
          description: The lead with its timeline (each activity has can_edit and edited_at).
        "403":
          description: Not the author and not SuperAdmin.
        "422":
          description: System activity, or empty body.
    delete:
      tags:
        - Leads
      summary: Delete a note, call or message (same rules as edit). The text is kept in the audit log.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The lead with its timeline.

  /campaigns/{campaignId}:
    delete:
      tags:
        - Campaigns
      summary: Delete a draft campaign (permission campaigns.manage). Queued, sent and cancelled campaigns are refused (422).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Deleted.
        "422":
          description: Not a draft.

  /sms-opt-outs/{optOutId}:
    delete:
      tags:
        - Campaigns
      summary: Remove a staff-added SMS opt-out (permission campaigns.manage). Opt-outs from the customer's own reply are refused (422).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Removed.
        "422":
          description: The customer opted out themselves.

  /posts:
    post:
      tags:
        - Blog
      summary: Create a post (permission blog.manage). Multipart; images[0] becomes the cover.
      security:
        - BearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, slug]
              properties:
                title: { type: string }
                slug: { type: string }
                subtitle: { type: string }
                content: { type: string }
                writer: { type: string }
                status: { type: boolean, description: "false hides the post from /v1/blog" }
                categories:
                  type: array
                  items: { type: integer }
                images:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "201":
          description: The post.
